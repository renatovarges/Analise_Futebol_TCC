name: Atualizar dados (FotMob)

# Busca os jogos novos no FotMob e publica o cache no GitHub, de onde o
# Streamlit Cloud serve o site — sem depender do PC ligado nem de viagem.
#
# HISTÓRICO: a versão anterior usava o SofaScore atrás de um proxy residencial.
# O SofaScore bloqueou nuvem, depois proxy grátis e, em out/2026, qualquer
# cliente que não seja navegador. O FotMob entrega as páginas de jogo como HTML
# comum (sem chave, sem proxy, sem disfarce), então este workflow não precisa
# de nenhum segredo.
#
# QUANDO RODA:
#   · todo dia às 07:00 UTC (04:00 em Brasília) — pega os jogos da noite anterior.
#     O GitHub pode atrasar o horário em alguns minutos; é normal.
#   · manualmente (aba Actions > Run workflow):
#       publicar = false (padrão): só TESTA o acesso ao FotMob, não publica nada.
#       publicar = true: atualiza o cache e publica (só vale rodando na main).
#
# CUSTO: repositório público = Actions gratuito e sem limite de minutos. Não usa
# chave nem crédito de IA — só baixa dados do FotMob. Se não houver jogo novo,
# não cria commit.
#
# ATENÇÃO: o GitHub desliga agendamentos de repositório sem NENHUMA atividade por
# 60 dias. Como o robô só comita quando há jogo novo, numa pausa longa (fim de
# temporada) ele pode ser desligado — é só reativar na aba Actions.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar no GitHub? (false = só testa o acesso ao FotMob)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atualizar-diario
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar acesso ao FotMob (não publica nada)
        run: |
          python - <<'EOF'
          import warnings, logging
          warnings.filterwarnings("ignore"); logging.disable(logging.CRITICAL)
          import fotmob_api as f
          eventos = f._eventos_da_temporada()
          print("calendário:", len(eventos), "jogos")
          if not eventos:
              raise SystemExit(f"FALHOU: calendário não veio ({f.ULTIMO_ERRO})")
          alvo = next(e for e in eventos if e["terminado"])
          det = f._detalhes(alvo)
          if det is None:
              raise SystemExit(f"FALHOU: página do jogo {alvo['id']} ({f.ULTIMO_ERRO})")
          print("jogo", alvo["id"], "-> OK, xG", det[0]["xg"])
          EOF

      - name: Atualizar o cache e publicar
        if: ${{ (github.event_name == 'schedule' || inputs.publicar) && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # actions/checkout deixa em detached HEAD; o script faz `git push` sem
          # argumentos, que exige estar numa branch com upstream.
          git checkout -B main origin/main
          python scripts/atualizar_e_publicar.py
