name: TESTE — diagnóstico de proxy (descartável)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          SOFASCORE_PROXY: http://${{ secrets.WEBSHARE_PROXY_USER }}:${{ secrets.WEBSHARE_PROXY_PASS }}@${{ secrets.WEBSHARE_PROXY_HOST }}:${{ secrets.WEBSHARE_PROXY_PORT }}
        run: python scripts/_scratch_diagnostico_proxy.py
