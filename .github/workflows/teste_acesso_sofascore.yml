name: Teste de acesso ao SofaScore (GitHub Actions)

# Só roda quando disparado manualmente — é um teste de diagnóstico,
# não faz parte da rotina automática do projeto e não altera nada.
on:
  workflow_dispatch:

jobs:
  testar-acesso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instala dependências
        run: pip install soccerdata==1.9.0 streamlit

      - name: Tenta buscar a rodada 24 do SofaScore (mesmo código do projeto)
        run: |
          python -c "
          from sofascore_api import _get, TOURNAMENT_ID, SEASON_ID, API
          d = _get(f'{API}/unique-tournament/{TOURNAMENT_ID}/season/{SEASON_ID}/events/round/24')
          if d and d.get('events'):
              print('SUCESSO —', len(d['events']), 'eventos recebidos')
          else:
              print('FALHOU — nenhuma resposta válida (provável bloqueio da Cloudflare)')
              raise SystemExit(1)
          "
